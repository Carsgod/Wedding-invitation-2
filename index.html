<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="You are warmly invited to the wedding of Edwin Nyarko & Regina Apaloo. October 24, 2026.">

  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="scene">
    <div class="card" id="card" data-state="closed">
      <div class="shimmer"></div>
      
      <div class="page back-page" id="backPage">
        <img src="images/back page.jpeg" alt="Back Cover">
        <a class="rsvp-btn" href="https://carsgod.github.io/EDwinsREG.forever/" target="_blank" rel="noopener">RSVP</a>
      </div>
      
      <div class="page right-page" id="rightPage">
        <img src="images/inside right for invitation 2.jpeg" alt="Inside Right">
      </div>
      
      <div class="page center-page" id="centerPage">
        <img src="images/inside center for invitation 2.jpeg" alt="Inside Center">
      </div>
      
      <div class="page left-page" id="leftPage">
        <img src="images/inside left.jpeg" alt="Inside Left">
      </div>
      
      <div class="page front-page" id="frontPage">
        <img src="images/front page.jpeg" alt="Front Cover">
      </div>
    </div>
  </div>
  
  <div class="particles" aria-hidden="true">
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
  </div>
  
  <div class="ui">
    <div class="controls">
      <button class="nav-btn" id="prevBtn" aria-label="Previous">&#10094;</button>
      <span class="state-label" id="stateLabel" aria-live="polite">Front Cover</span>
      <button class="nav-btn" id="nextBtn" aria-label="Next">&#10095;</button>
    </div>
    <p class="hint" id="hint">Click the card to open</p>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
